services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internetdesa_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - internetdesa

  nginx:
    image: nginx:1.27-alpine
    container_name: internetdesa_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internetdesa

  db:
    image: mysql:8.4
    container_name: internetdesa_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alfa_internetdesa
      MYSQL_USER: devops
      MYSQL_PASSWORD: Mojosari!@#456
      MYSQL_ROOT_PASSWORD: Mojosari!@#456
    volumes:
      - internetdesa_db_data:/var/lib/mysql
    networks:
      - internetdesa

  redis:
    image: redis:7-alpine
    container_name: internetdesa_redis
    restart: unless-stopped
    networks:
      - internetdesa

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internetdesa_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - db
      - redis
    networks:
      - internetdesa

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internetdesa_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - db
      - redis
    networks:
      - internetdesa

networks:
  internetdesa:
    driver: bridge

volumes:
  internetdesa_db_data:
