<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradient untuk Background Sawah/Alam -->
    <linearGradient id="gradient-nature" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#115E59" /> <!-- Teal Tua -->
      <stop offset="100%" stop-color="#14B8A6" /> <!-- Teal Muda -->
    </linearGradient>

    <!-- Gradient untuk Sinyal Internet / Tekno -->
    <linearGradient id="gradient-tech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" /> <!-- Sky Blue -->
      <stop offset="100%" stop-color="#2563EB" /> <!-- Royal Blue -->
    </linearGradient>
    
    <!-- Shadow untuk Efek Kedalaman -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Lingkaran Organik / Base Icon -->
  <circle cx="400" cy="400" r="360" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="8"/>

  <!-- KELOMPOK 1: LANSKAP DESA (Gunung & Sawah terasering) -->
  <g id="village-landscape" filter="url(#drop-shadow)">
    <!-- Gunung / Bukit Belakang -->
    <path d="M 180 550 L 320 380 L 450 550 Z" fill="#0D9488" opacity="0.7" />
    <path d="M 320 550 L 480 340 L 640 550 Z" fill="url(#gradient-nature)" />
    
    <!-- Terasering Sawah (Garis Melengkung Dinamis) -->
    <path d="M 160 540 Q 300 500 400 560 T 640 530" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round"/>
    <path d="M 180 580 Q 350 550 480 610 T 620 580" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Jalan/Aliran Data Menuju Desa -->
    <path d="M 400 540 Q 390 620 350 700" fill="none" stroke="#0EA5E9" stroke-width="16" stroke-linecap="round" stroke-dasharray="4 20" />
  </g>

  <!-- KELOMPOK 2: RUMAH JOGLO (Simbol Desa/Kearifan Lokal) -->
  <g id="joglo-house" filter="url(#drop-shadow)">
    <!-- Atap Utama Joglo -->
    <path d="M 330 460 L 350 400 L 450 400 L 470 460 Z" fill="#EA580C" />
    <!-- Atap Tumpang Bawah -->
    <path d="M 290 520 L 320 460 L 480 460 L 510 520 Z" fill="#C2410C" />
    <!-- Pilar / Saka Guru -->
    <rect x="340" y="520" width="15" height="40" fill="#78350F" />
    <rect x="385" y="520" width="30" height="40" fill="#BAE6FD" opacity="0.5"/> <!-- Pintu Terbuka (Konektivitas) -->
    <rect x="445" y="520" width="15" height="40" fill="#78350F" />
    <line x1="280" y1="560" x2="520" y2="560" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- KELOMPOK 3: SINYAL WI-FI / INTERNET (Memayungi Desa) -->
  <g id="internet-signal">
    <!-- Node Pusat di Puncak Atap -->
    <circle cx="400" cy="360" r="14" fill="#0EA5E9" />
    
    <!-- Sinyal Lengkung 1 -->
    <path d="M 340 310 A 90 90 0 0 1 460 310" fill="none" stroke="url(#gradient-tech)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Sinyal Lengkung 2 -->
    <path d="M 290 250 A 160 160 0 0 1 510 250" fill="none" stroke="url(#gradient-tech)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Sinyal Lengkung 3 (Paling Luar) -->
    <path d="M 230 190 A 240 240 0 0 1 570 190" fill="none" stroke="url(#gradient-tech)" stroke-width="22" stroke-linecap="round" />

    <!-- Simbol Orbit Node Kecil (Tech Mesh) -->
    <circle cx="232" cy="190" r="10" fill="#2563EB" />
    <circle cx="568" cy="190" r="10" fill="#2563EB" />
    <circle cx="340" cy="310" r="7" fill="#0EA5E9" />
    <circle cx="460" cy="310" r="7" fill="#0EA5E9" />
  </g>
</svg>
